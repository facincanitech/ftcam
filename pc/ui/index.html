<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTCam</title>
<link rel="icon" href="/icone.png">
<style>
:root{
  --bg:#0a0f16;--bg2:#101823;--card:#151f2c;--card2:#1b2737;--line:#243244;--txt:#e7eef6;--mut:#8b9bb0;
  --acc:#4c8dff;--acc2:#3fa9f5;--ok:#2ecc71;--bad:#ff4d4f;--warn:#f5a524;--glass:rgba(16,24,35,.82);
  --r:12px;--side:290px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;height:100%}
#side{width:var(--side);background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .25s}
#side.closed{margin-left:calc(-1 * var(--side))}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#stage{flex:1;position:relative;min-height:0}
#grid{position:absolute;inset:0;display:grid;gap:3px;background:#05080c;padding:3px}

/* ---------- side / alertas ---------- */
.side-head{padding:64px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.side-head h3{margin:0;font-size:14px;flex:1;color:var(--mut);font-weight:600;letter-spacing:.3px}
.icon-btn{background:transparent;border:0;border-radius:8px;padding:6px;display:inline-flex;color:var(--mut)}
.icon-btn:hover{background:var(--card2);color:var(--txt)}
.icon-btn.on{color:var(--acc)}
#alertList{flex:1;overflow:auto;padding:6px 10px 90px}
.day{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--mut);font-size:12px;margin:14px 0 8px;position:sticky;top:0;background:var(--bg2);padding:4px 0;z-index:1}
.al{display:flex;gap:10px;align-items:center;padding:7px;border-radius:10px;background:var(--card);border:1px solid transparent;margin-bottom:6px;cursor:pointer;position:relative}
.al:hover{border-color:var(--line);background:var(--card2)}
.al.sel{border-color:var(--acc)}
.al img{width:78px;height:46px;object-fit:cover;border-radius:6px;background:#000}
.al b{display:block;font-size:13px}
.al small{color:var(--mut);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:1px 6px;border-radius:20px;background:rgba(76,141,255,.15);color:#9cc0ff;margin-top:2px}
.tag.pessoa{background:rgba(255,77,79,.15);color:#ff9a9b}
.tag.manual{background:rgba(245,165,36,.15);color:#ffd08a}
.al input[type=checkbox]{position:absolute;right:8px;top:8px;display:none}
.selecting .al input[type=checkbox]{display:block}
.empty{color:var(--mut);text-align:center;padding:40px 10px;font-size:13px}

/* ---------- tiles ---------- */
.tile{position:relative;background:#0d141d;overflow:hidden;cursor:pointer;min-height:0}
.tile img.live{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.fill .tile img.live{object-fit:cover}
.tile .off{display:none}
.tile.offline .off{display:flex;background:#0d141d}
.tile.offline img.live{visibility:hidden}
.tile .lbl{position:absolute;right:8px;bottom:6px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.on{background:var(--ok)}
.tile .clock{position:absolute;left:8px;top:6px;background:rgba(0,0,0,.45);padding:1px 6px;font-size:12px;font-variant-numeric:tabular-nums;border-radius:4px}
.tile .rec{position:absolute;left:8px;bottom:7px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;display:none;animation:blink 1.2s infinite}
.tile.recording .rec{display:block}
.tile.recording{outline:2px solid var(--bad);outline-offset:-2px}
@keyframes blink{50%{opacity:.45}}
.off{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);gap:6px}
.off svg{width:34px;height:34px}
.off small{font-size:11px;opacity:.7;max-width:80%;text-align:center}
.add-tile{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mut);border:2px dashed var(--line);background:transparent}
.add-tile:hover{color:var(--txt);border-color:var(--acc)}

/* foco numa câmera */
#focusBar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:4px;z-index:5}
.pill{background:var(--glass);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.07);border-radius:22px;display:flex;align-items:center;gap:2px;padding:5px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.pill .pb{background:transparent;border:0;border-radius:16px;padding:7px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#c8d4e3}
.pill .pb:hover{background:rgba(255,255,255,.08);color:#fff}
.pill .pb.on{color:var(--acc)}
.pill .pb.danger.on{color:var(--bad)}

/* pílulas flutuantes */
#tl{position:absolute;left:14px;top:12px;z-index:20}
#tr{position:absolute;right:14px;top:12px;z-index:20}
#qlay{right:0;left:auto;top:52px;width:auto;min-width:300px}
#bl{position:fixed;left:10px;bottom:10px;z-index:20;width:calc(var(--side) - 20px)}
#bl .pill{justify-content:space-around;background:rgba(16,24,35,.92)}
#bl .pill .pb{flex:1;padding:7px 2px;min-width:0}
#bl .pill .pb span{white-space:nowrap;font-size:10.5px}
.brand{font-weight:800;letter-spacing:.5px;padding:0 10px 0 6px;display:flex;align-items:center;gap:8px}
.brand img{width:22px;height:22px;border-radius:6px}
.badge{position:absolute;top:2px;right:4px;background:var(--acc);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:0 5px;min-width:16px;text-align:center}
.relative{position:relative}

/* ---------- timeline ---------- */
#timeline{height:0;overflow:hidden;background:var(--bg2);border-top:1px solid var(--line);transition:height .25s;display:flex;flex-direction:column}
#timeline.open{height:210px}
.tl-head{display:flex;align-items:center;gap:10px;padding:8px 14px 2px 14px;color:var(--mut);font-size:12px}
.tl-head .sp{flex:1}
.tl-axis{position:relative;height:22px;margin:0 14px 0 150px;border-bottom:1px solid var(--line)}
.tl-axis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--mut);top:3px}
.tl-rows{flex:1;overflow:auto;padding-bottom:8px}
.tl-row{display:flex;align-items:center;height:30px;border-bottom:1px solid rgba(255,255,255,.03)}
.tl-row .n{width:150px;padding:0 14px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-track{flex:1;position:relative;height:16px;margin-right:14px;background:rgba(255,255,255,.025);border-radius:4px}
.tl-ev{position:absolute;top:2px;height:12px;min-width:4px;border-radius:3px;background:var(--bad);cursor:pointer;opacity:.9}
.tl-ev.movimento{background:#ff6b5b}.tl-ev.pessoa{background:#ff2e63}.tl-ev.manual{background:var(--warn)}
.tl-ev:hover{opacity:1;outline:2px solid #fff}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--acc)}

/* ---------- modais ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,10,.62);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal.wide{width:min(1180px,100%)}
.modal.small{width:min(520px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:18px;flex:1}
.mb{padding:18px 20px;overflow:auto}
.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#36506e}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.red{color:var(--bad);border-color:rgba(255,77,79,.4)}
.btn.green{background:#1f7a3f;border-color:#1f7a3f;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.form{display:grid;grid-template-columns:200px 1fr;gap:12px 16px;align-items:center}
.form label{color:var(--mut);text-align:right}
.form .full{grid-column:1/-1}
.hint{color:var(--mut);font-size:12px;margin-top:3px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{background:transparent;border:0;border-radius:7px;padding:6px 11px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center;color:#c8d4e3}
.chip.on{border-color:var(--acc);background:rgba(76,141,255,.15);color:#fff}
.switch{position:relative;width:40px;height:22px;display:inline-block}
.switch input{display:none}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--acc)}
.switch input:checked+span:before{transform:translateX(18px)}
input[type=range]{padding:0;accent-color:var(--acc)}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px}
.cat h4{margin:0 0 8px;font-size:13px;display:flex;gap:7px;align-items:center}
.cat a{display:block;padding:6px 8px;border-radius:7px;color:#c8d4e3;cursor:pointer}
.cat a:hover{background:var(--card2);color:#fff}

.cams{display:grid;gap:8px}
.camrow{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px}
.camrow img,.camrow .ph{width:96px;height:54px;border-radius:7px;object-fit:cover;background:#000;flex:none}
.camrow .info{flex:1;min-width:0}
.camrow .info small{color:var(--mut);display:block}
.err{color:#ff9a9b;font-size:12px}

.sysbars{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sb{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;display:flex;align-items:center;gap:7px}
.sb .bar{width:60px;height:5px;background:var(--line);border-radius:4px;overflow:hidden}
.sb .bar i{display:block;height:100%;background:var(--ok)}
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.sys-grid h3{margin:0 0 10px;font-size:16px}
.sys-grid .btn{width:100%;margin-bottom:7px;justify-content:flex-start}

/* player */
#player .mb{padding:0;background:#000;position:relative;display:flex;justify-content:center}
#player video{max-width:100%;max-height:70vh;display:block}
#player .ts{position:absolute;left:12px;top:10px;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:5px;font-variant-numeric:tabular-nums}
#player .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);border:0;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
#player .nav.l{left:10px}#player .nav.r{right:10px}
.pctl{display:flex;justify-content:center;padding:10px}
.scrub{display:flex;align-items:center;gap:12px;padding:0 20px 14px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.scrub input{flex:1}

/* dropdowns / toasts */
.drop{position:absolute;right:0;top:52px;width:340px;max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.drop h4{margin:4px 6px 8px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.nt{display:flex;gap:10px;padding:8px;border-radius:9px;cursor:pointer}
.nt:hover{background:var(--card2)}
.nt small{color:var(--mut)}
.layouts{position:absolute;left:0;bottom:60px;width:auto}

.tile .exitfs{display:none;position:absolute;right:12px;top:12px;z-index:3;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px}
.tile:fullscreen .exitfs{display:block}
.tile:fullscreen img.live{object-fit:contain}

.tile .snd{position:absolute;right:8px;bottom:34px;background:rgba(0,0,0,.55);border:0;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;z-index:2;opacity:.85}
.tile .snd.on{background:var(--acc);opacity:1}
.tile .volr{position:absolute;right:48px;bottom:37px;display:none;align-items:center;gap:6px;background:rgba(0,0,0,.6);border-radius:16px;padding:4px 10px;z-index:2;color:#fff;font-size:11px}
.tile.sndon .volr{display:flex}
.tile .volr input{width:90px;accent-color:var(--acc)}
#ctx .volrow{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:13px;color:#d6e0ec}
#ctx .volrow input{flex:1;accent-color:var(--acc)}
.empty-slot{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mut);border:2px dashed var(--line);background:transparent;cursor:pointer;font-size:13px}
.empty-slot:hover{color:var(--txt);border-color:var(--acc)}
body.tv #tr,body.tv #tl,body.tv:not(.tvrec) #side,body.tv .snd,body.tv .volr,body.tv .exitfs{display:none!important}
body.ver #cfgBtn,body.ver #camBtn,body.ver #sysBtn{display:none!important}
body.tv .tile.tvsel{outline:4px solid var(--acc);outline-offset:-4px}
body.tv .al.tvsel{outline:3px solid var(--acc);outline-offset:-3px;background:rgba(59,130,246,.15)}
body.tv #side .sidehead button,body.tv #side input[type=checkbox]{display:none}
.tile .aib{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.6);border-radius:20px;padding:3px 11px;font-size:12px;display:none;gap:6px;align-items:center}
.tile .aib.on{display:flex}
.gridwrap{position:relative;user-select:none;background:#000;border-radius:10px;overflow:hidden}
.gridwrap img{width:100%;display:block}
.gridov{position:absolute;inset:0;display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(9,1fr);cursor:crosshair;touch-action:none}
.gridov div{border:1px solid rgba(255,120,120,.25);background:rgba(255,77,79,.28)}
.gridov div.on{background:rgba(76,141,255,.3);border-color:rgba(120,170,255,.55)}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.face{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.face img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#000}
.face input{width:100%;margin-top:6px;padding:5px 7px;font-size:12px}
.face .r{display:flex;gap:4px;margin-top:6px}.face .r .btn{flex:1;justify-content:center;padding:5px;font-size:12px}
.face.sel{border-color:var(--acc)}
.tag.rosto{background:rgba(46,204,113,.15);color:#8ff0b5}
.tag.animal{background:rgba(46,204,113,.15);color:#8ff0b5}
.tag.veículo{background:rgba(245,165,36,.15);color:#ffd08a}

.tile video.hd{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;opacity:0}
.tile video.hd.on{background:#000;opacity:1}
.fill .tile video.hd{object-fit:cover}
.tile.hdmode img.live{visibility:hidden}
.tile canvas.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ctx .head{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px}
#ctx .head b{flex:1;font-size:13px}
#ctx .grp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#d6e0ec;font-size:13px}
#ctx .grp:hover{background:var(--card2);color:#fff}
#ctx .grp .ar{margin-left:auto;color:var(--mut);transition:transform .15s}
#ctx .grp.open .ar{transform:rotate(90deg)}
#ctx .sub{display:none;padding:2px 0 4px 26px}
#ctx .grp.open+.sub{display:block}
#ctx .sub .ci{padding:6px 10px}
#ctx .sub .chips{padding:4px 10px 6px}
#ctx .sub .chip{font-size:12px;padding:4px 8px}
#ctx{position:fixed;z-index:95;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:250px;max-height:calc(100vh - 16px);overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.5)}
#ctx .ci{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#d6e0ec;font-size:13px}
#ctx .ci:hover{background:var(--card2);color:#fff}
#ctx .ci .ck{margin-left:auto;color:var(--acc);font-weight:700}
#ctx .sep{height:1px;background:var(--line);margin:5px 4px}
#ctx .hd{padding:6px 10px 2px;color:var(--mut);font-size:11px;letter-spacing:.4px}
.tile .res{position:absolute;left:8px;top:28px;background:rgba(0,0,0,.45);padding:0 6px;font-size:10.5px;border-radius:4px;color:#cfd9e6}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:10px 14px;min-width:260px;box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer;animation:slide .25s}
.toast.info{border-left-color:var(--acc)}
@keyframes slide{from{transform:translateY(20px);opacity:0}}
.banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(255,77,79,.15);border:1px solid rgba(255,77,79,.4);color:#ffb3b4;border-radius:10px;padding:8px 14px;z-index:15;font-size:13px}
.disc-list{display:grid;gap:8px;margin-top:12px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.preview{width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:10px;margin-top:8px}
.tapo-ctl{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- celular: vídeo em cima, alertas embaixo ---------- */
@media (max-width:800px){
  html,body{overflow:hidden}
  #app{flex-direction:column}
  #main{order:1;flex:none}
  #stage{height:min(56.25vw,48vh);min-height:190px}
  #side,#side.closed{order:2;width:100%;margin-left:0;flex:1;min-height:0;border-right:0;border-top:1px solid var(--line)}
  .side-head{padding:10px 12px 8px}
  #alertList{padding:4px 10px 96px}
  .al img{width:96px;height:56px}
  #tl{left:8px;top:8px}#tr{right:8px;top:8px}
  #tl .brand{padding:0 6px 0 4px;font-size:13px}#sideBtn{display:none}
  .pill .pb{padding:6px 8px}
  #bl{left:50%;transform:translateX(-50%);bottom:10px;width:auto}
  #bl .pb span{display:none}
  #bl .pill{padding:4px}
  #tl .pill,#tr .pill,.pill{backdrop-filter:blur(8px)}
  .tile .clock{font-size:10px}.tile .res{display:none}.tile .lbl{font-size:11px}
  #focusBar{bottom:8px;max-width:calc(100% - 16px);overflow-x:auto}
  #focusBar .pb span{display:none}
  #timeline.open{height:170px}
  .tl-axis{margin-left:90px}.tl-row .n{width:90px;padding:0 8px}
  .modal-bg{padding:8px;align-items:flex-end}
  .modal{max-height:94vh;border-radius:14px}
  .mh{padding:12px 14px}.mh h2{font-size:16px}.mb{padding:14px}.mf{padding:10px 14px;flex-wrap:wrap}
  .form{grid-template-columns:1fr;gap:6px 0}.form label{text-align:left;margin-top:6px}
  #player video{max-height:45vh}
  #player .mh{gap:6px}#player .mh h2{font-size:14px;line-height:1.25}#player .mh h2 small{display:block}

};
const ic=(n,s='')=>`<svg class="i" viewBox="0 0 24 24" ${s}>${P[n]||''}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)});if(!r.ok&&r.status!==400)throw new Error(r.status);return r.json()};
const fmtT=t=>new Date(t*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const fmtD=t=>new Date(t*1000).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
const fmtDT=t=>new Date(t*1000).toLocaleString('pt-BR');
const TIPO={movimento:['Movimento','camera'],pessoa:['Pessoa','user'],manual:['Manual','hand'],'veículo':['Veículo','camera'],animal:['Animal','paw'],'linha cruzada':['Linha','bolt'],'câmera obstruída':['Obstrução','eyeoff']};
const tag=t=>{const [n,i]=TIPO[t]||[t,'camera'];return `<span class="tag ${esc(t)}">${ic(i,'style="width:11px;height:11px"')} ${esc(n)}</span>`};

/* ================= estado ================= */

/* ================= init ================= */
$('#fBtn').innerHTML=ic('filter');$('#sBtn').innerHTML=ic('check');$('#dBtn').innerHTML=ic('trash');
$('#sideBtn').innerHTML=ic('chevL');$('#bellBtn').innerHTML=ic('bell')+'<span class="badge hidden" id="bellN"></span>';$('#sysBtn').innerHTML=ic('server');$('#gridBtn').innerHTML=ic('grid');
$('#cfgBtn').innerHTML=ic('sliders');$('#camBtn').innerHTML=ic('wrench');$('#tlBtn').innerHTML=ic('history');
$('#tlRange').innerHTML=[1,3,7,30].map(d=>`<button data-d="${d}" onclick="S.tlDays=${d};renderTimeline()">${d===1?'24h':d+' dias'}</button>`).join('');
if(localStorage.ftSide==='0')toggleSide(true);

async function refresh(){
  try{
    const e=await api('/api/estado');S.estado=e;
    if(S.clipSeq!==undefined&&e.clipes!==S.clipSeq)loadAlerts();S.clipSeq=e.clipes;
    renderGrid();renderNotif();renderBanner();
    const top=e.notificacoes[0];
    if(top&&top.seq!==S.lastSeq){
      if(S.lastSeq&&top.seq>S.lastSeq){e.notificacoes.filter(n=>n.seq>S.lastSeq).slice(0,3).forEach(n=>toast(`<b>${esc(n.camera)}</b><br><small>${TIPO[n.tipo]?.[0]||n.tipo} às ${fmtT(n.quando)}</small>`,'',()=>fullTile(n.camera_id)))}
      S.lastSeq=top.seq;localStorage.ftSeq=top.seq;setTimeout(loadAlerts,(S.estado.cameras.length?1:0)*1500);
    }
  }catch(err){}
}
setInterval(refresh,2000);
setInterval(loadAlerts,30000);
setInterval(()=>document.querySelectorAll('.clock').forEach(c=>c.textContent=new Date().toLocaleString('pt-BR')),1000);
refresh().then(loadAlerts);

/* ================= grade ================= */
function cols(n){if(S.layout!=='auto'){return +S.layout}return n<=1?1:n<=4?2:n<=9?3:4}
/* quadros: cada quadro mostra a câmera que você escolher (guardado neste aparelho) */
function slotStore(){try{return JSON.parse(localStorage.ftSlots||'{}')}catch(e){return{}}}
function getSlots(n,cams){const st=slotStore(),ids=cams.map(c=>c.id);
  let sl=(st[n]||[]).slice(0,n).map(x=>x===''?'':ids.includes(x)?x:null);while(sl.length<n)sl.push(null);
  const used=new Set(sl.filter(Boolean)),free=ids.filter(i=>!used.has(i));
  return sl.map(x=>x===null?(free.shift()||null):x)}
function setSlot(i,id){const st=slotStore(),n=S.slotN;let sl=(S.slots||[]).slice();
  if(id)sl=sl.map(x=>x===id?'':x);sl[i]=id||'';st[n]=sl;localStorage.ftSlots=JSON.stringify(st);closeCtx();renderGrid(true)}
function renderGrid(force){
  const cams=S.estado.cameras.filter(c=>c.ativa);
  const g=$('#grid');
  const n=S.layout==='auto'?Math.max(1,cams.length):(+S.layout)**2;
  const slots=getSlots(n,cams);
  const key=JSON.stringify([cams.map(c=>c.id),slots,S.layout]);
  if(key!==S.camsKey||force){
    S.camsKey=key;S.slots=slots;S.slotN=n;S.focus=null;
    const c=cols(S.layout==='auto'?cams.length||1:n);
    g.style.gridTemplateColumns=`repeat(${c},1fr)`;g.style.gridTemplateRows=`repeat(${Math.ceil(n/c)},1fr)`;
    const auto0=!cams.length&&S.layout==='auto';
    if(auto0){g.style.gridTemplateColumns='1fr';g.style.gridTemplateRows='1fr'}
    g.innerHTML=!auto0?slots.map((id,i)=>{const cam=cams.find(x=>x.id===id);
      if(!cam)return `<div class="tile empty-slot" onclick="slotMenu(event,${i})">${ic('plus','style="width:26px;height:26px"')}<span>Escolher câmera</span></div>`;
      return `
      <div class="tile ${cam.online?'':'offline'}" id="t-${cam.id}" onclick="slotMenu(event,${i})" ondblclick="event.stopPropagation();document.fullscreenElement?exitFull():fullTile('${cam.id}')" oncontextmenu="ctxMenu(event,'${cam.id}')">
        <img class="live" data-id="${cam.id}"><canvas class="ov" data-id="${cam.id}"></canvas><span class="aib"></span>${cam.som!==false?`<button class="snd ${S.sound===cam.id?'on':''}" title="Ouvir som" onclick="event.stopPropagation();toggleSound('${cam.id}')">${ic(S.sound===cam.id?'vol':'mute')}</button><div class="volr" onclick="event.stopPropagation()" ondblclick="event.stopPropagation()"><input type="range" min="0" max="300" step="5" value="${volPct()}" oninput="setVol(this.value)"><span class="vv">${volPct()}%</span></div>`:''}
        <div class="off">${ic('power')}<span>Off</span><small class="offmsg">${esc(cam.erro||'Sem conexão com a câmera')}</small></div>
        <span class="clock">${new Date().toLocaleString('pt-BR')}</span><span class="res"></span><button class="exitfs" onclick="event.stopPropagation();exitFull()">✕ Sair da tela cheia (Esc)</button><span class="rec">● REC</span>
        <span class="lbl"><i class="dot ${cam.online?'on':''}"></i>${esc(cam.nome)}</span>
      </div>`}).join(''):`<button class="tile add-tile" onclick="openCameras(true)">${ic('plus','style="width:34px;height:34px"')}Adicionar câmera</button>`;
    renderFocusBar();markSound();
    document.querySelectorAll('#grid img.live').forEach(startLive);
    document.querySelectorAll('#grid canvas.ov').forEach(startBoxes);
  }
  cams.forEach(c=>{const t=document.getElementById('t-'+c.id);if(!t)return;
    t.classList.toggle('recording',!!c.gravando_alerta);
    const was=t.classList.contains('offline');t.classList.toggle('offline',!c.online);
    const dot=t.querySelector('.lbl .dot');if(dot)dot.classList.toggle('on',!!c.online);
    const nm=t.querySelector('.lbl');if(nm&&nm.lastChild&&nm.lastChild.nodeType===3&&nm.lastChild.textContent!==c.nome)nm.lastChild.textContent=c.nome;
    const m=t.querySelector('.offmsg');if(m)m.textContent=c.erro||'Sem conexão com a câmera';
    const hasHD=!!t.querySelector('video.hd');
    // no Alto fica no Alto: não derruba o vídeo só porque um status veio sem o codec
    const wantHD=c.qualidade==='alta'&&(hasHD||(!!c.hd_codec&&!(t._hdFail&&Date.now()-t._hdFail<5000)));
    if(wantHD&&!t.querySelector('video.hd'))startHD(t,c.id);
    if(!wantHD&&t.querySelector('video.hd'))stopHD(t);
    const hv=t.querySelector('video.hd');
    const r=t.querySelector('.res');if(r)r.textContent=c.online&&c.resolucao?(hv&&hv.videoWidth?`HD · ${hv.videoWidth}×${hv.videoHeight} · placa de vídeo`:`Leve · ${c.resolucao}${c.fps?` · ${c.fps} fps`:''}`):'';
    const b=t.querySelector('.aib');if(b){const objs=c.objetos_agora||[];
      const txt=objs.length?[...new Set(objs.map(o=>o.nome))].join(', '):(c.verificando?'IA verificando…':'');
      b.textContent=txt?('🔍 '+txt):'';b.classList.toggle('on',!!txt)}});
  document.getElementById('grid').classList.toggle('fill',localStorage.ftFill==='1');
}
/* ao vivo: baixa um quadro de cada vez e só troca quando o próximo já carregou (sem preto, sem piscar) */
function startLive(img){
  if(img._live)return;img._live=true;const id=img.dataset.id;let fails=0,seq=-1;
  const tick=async()=>{
    if(!document.body.contains(img))return;
    const tile=img.closest('.tile');
    if(tile&&tile.classList.contains('offline')){setTimeout(tick,1000);return}
    if(document.hidden||window.__ftHidden){setTimeout(tick,2000);return}
    if(tile&&tile.classList.contains('hdmode')){setTimeout(tick,1000);return}  // janela escondida/minimizada: não pede imagem
    try{
      // o servidor segura o pedido até sair um quadro novo: chega na hora, sem repetir quadro
      const r=await fetch(`/api/foto/${id}?q=72&apos=${seq}&t=${Date.now()}`,{cache:'no-store'});
      if(r.ok){seq=+(r.headers.get('X-Quadro')||seq);const u=URL.createObjectURL(await r.blob());
        await new Promise(res=>{const pre=new Image();pre.onload=pre.onerror=res;pre.src=u});
        const old=img.dataset.url;img.src=u;img.dataset.url=u;if(old)URL.revokeObjectURL(old);fails=0}
      else fails++;
    }catch(e){fails++}
    setTimeout(tick,fails?Math.min(3000,300*fails):0);
  };tick();
}
/* quadrados da IA por cima do ao vivo */
const BOXCOL={pessoa:'#ff4d4f','veículo':'#f5a524',animal:'#2ecc71',pacote:'#4c8dff'};
function startBoxes(cv){
  if(cv._on)return;cv._on=true;const id=cv.dataset.id;
  const loop=async()=>{
    if(!document.body.contains(cv))return;
    const c=(S.estado?.cameras||[]).find(x=>x.id===id);
    const want=c&&c.online&&(c.ia_ao_vivo||c.gravando_alerta||c.verificando);
    let d=null;
    if(want){try{d=await api(`/api/cameras/${id}/deteccoes`)}catch(e){}}
    drawBoxes(cv,d);
    setTimeout(loop,want?400:1500);
  };loop();
}
function drawBoxes(cv,d){
  const hv=cv.parentNode.querySelector('video.hd');const img=(hv&&hv.videoWidth)?hv:cv.parentNode.querySelector('img.live');const W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  const g=cv.getContext('2d');g.clearRect(0,0,W,H);
  const nw=img&&(img.videoWidth||img.naturalWidth),nh=img&&(img.videoHeight||img.naturalHeight);
  if(!d||!d.objetos||!d.objetos.length||!nw||!d.dim||!d.dim[0])return;
  const fill=getComputedStyle(img).objectFit==='cover';
  const s=(fill?Math.max:Math.min)(W/nw,H/nh);
  const dw=nw*s,dh=nh*s,ox=(W-dw)/2,oy=(H-dh)/2;
  const sx=dw/d.dim[0],sy=dh/d.dim[1];
  g.lineWidth=2;g.font='600 12px Segoe UI, system-ui, sans-serif';
  d.objetos.forEach(o=>{
    const [x1,y1,x2,y2]=o.box,col=BOXCOL[o.tipo]||'#fff';
    const x=ox+x1*sx,y=oy+y1*sy,w=(x2-x1)*sx,h=(y2-y1)*sy;
    g.strokeStyle=col;g.strokeRect(x,y,w,h);
    const t=`${o.nome} ${Math.round(o.conf*100)}%`,tw=g.measureText(t).width+8;
    g.fillStyle=col;g.fillRect(x-1,Math.max(0,y-18),tw,18);g.fillStyle='#000';g.fillText(t,x+3,Math.max(13,y-5));
  });
}
/* som ao vivo */
function volPct(){const v=localStorage.ftVol;return v==null||v===''||isNaN(+v)?100:+v}
function setVol(p){p=Math.max(0,Math.min(300,+p||0));localStorage.ftVol=p;if(S.gain)S.gain.gain.value=p/100;
  document.querySelectorAll('.vv').forEach(e=>e.textContent=p+'%');document.querySelectorAll('.volr input,.volrow input').forEach(e=>{if(+e.value!==p)e.value=p})}
function markSound(){document.querySelectorAll('.tile').forEach(t=>{const on=!!S.sound&&t.id==='t-'+S.sound;t.classList.toggle('sndon',on);
  const b=t.querySelector('.snd');if(b){b.classList.toggle('on',on);b.innerHTML=ic(on?'vol':'mute')}})}
function toggleSound(id){
  if(S.audioEl){S.audioEl.onerror=S.audioEl.onended=null;S.audioEl.pause();S.audioEl.removeAttribute('src');S.audioEl.load();S.audioEl=null}
  clearTimeout(S.audioRetryT);
  if(S.sound===id){S.sound=null;S.audioTries=0}
  else{S.sound=id;soundConnect(id)}
  markSound();
}
function soundConnect(id){

async function startHD(tile,id){
  if(!window.MediaSource){tile._hdFail=Date.now();hdLog('janela sem MediaSource');return}
  if(tile._hdBusy)return;tile._hdBusy=true;
  // o vídeo novo entra por baixo; o antigo (congelado) só sai quando o novo já estiver tocando: sem piscar
  const v=document.createElement('video');v.className='hd';v.muted=true;v.autoplay=true;v.playsInline=true;
  tile.insertBefore(v,tile.querySelector('canvas.ov'));tile._hdCur=v;
  const ctrl=new AbortController();v._ctrl=ctrl;
  const drop=()=>{try{ctrl.abort()}catch(e){}v.removeAttribute('src');v.load();v.remove()};
  const fail=why=>{tile._hdBusy=false;if(tile._hdCur!==v){drop();return}
    tile._hdFail=Date.now();tile._hdFails=(tile._hdFails||0)+1;
    if(tile._hdFails<=3||tile._hdFails%20===0)hdLog(`alta falhou na janela (${why||'?'}) x${tile._hdFails}`);
    stopHD(tile)};
  let lastT=-1,lastMove=Date.now();
  const watch=setInterval(()=>{if(!document.body.contains(v)||tile._hdCur!==v){clearInterval(watch);return}
    if(v.currentTime!==lastT){lastT=v.currentTime;lastMove=Date.now();if(v.currentTime>3)tile._hdFails=0}
    else if(Date.now()-lastMove>15000){clearInterval(watch);fail(`congelou; buffer=${v.buffered.length?v.buffered.start(0).toFixed(1)+'-'+v.buffered.end(v.buffered.length-1).toFixed(1):'vazio'} t=${v.currentTime.toFixed(1)} rs=${v.readyState} err=${v.error?v.error.code:0}`)}},1000);
  try{
    const ms=new MediaSource();v.src=URL.createObjectURL(ms);
    await new Promise(r=>ms.addEventListener('sourceopen',r,{once:true}));
    const r=await fetch(`/api/hd/${id}?t=${Date.now()}`,{signal:ctrl.signal,cache:'no-store'});
    if(!r.ok)return fail('servidor '+r.status);
    const mime=`video/mp4; codecs="${r.headers.get('X-Codec')||'avc1.640028'}"`;
    if(!MediaSource.isTypeSupported(mime))return fail('codec não suportado: '+mime);
    const sb=ms.addSourceBuffer(mime);const q=[];
    const pump=()=>{if(sb.updating)return;
      if(q.length){try{sb.appendBuffer(q.shift())}catch(e){fail('append: '+e.name)}return}
      if(v.buffered.length){const end=v.buffered.end(v.buffered.length-1),st=v.buffered.start(0);
        if(v.currentTime<st)v.currentTime=st;
        const lag=end-v.currentTime;                             // fica no ao vivo sem ficar pulando
        if(lag>4)v.currentTime=end-0.8;else v.playbackRate=lag>2.2?1.12:1;
        if(v.currentTime-st>30){try{sb.remove(st,v.currentTime-10)}catch(e){}}}};  // não acumula memória
    sb.addEventListener('updateend',pump);
    v.addEventListener('playing',()=>{if(tile._hdCur!==v)return;
      tile.querySelectorAll('video.hd').forEach(o=>{if(o!==v){try{o._ctrl&&o._ctrl.abort()}catch(e){}o.remove()}});
      v.classList.add('on');tile.classList.add('hdmode')},{once:true});
    const rd=r.body.getReader();
    while(true){
      const {done,value}=await rd.read();if(done||!document.body.contains(v)||tile._hdCur!==v)break;
      q.push(value);pump();if(v.paused)v.play().catch(()=>{});
    }
  }catch(e){if(e.name!=='AbortError')fail('erro: '+e.name+' '+e.message);else tile._hdBusy=false;return}
  tile._hdBusy=false;
  // a conexão acabou (gravador reiniciou): já reconecta, deixando a última imagem na tela até voltar
  if(document.body.contains(v)&&tile._hdCur===v)setTimeout(()=>{if(document.body.contains(v)&&tile._hdCur===v)startHD(tile,id)},300);
}

function play(i){
  S.playIdx=i;const a=S.alerts[i];if(!a)return;
  document.querySelectorAll('.al').forEach((el,k)=>el.classList.toggle('sel',k===i));
  modal(`<div class="modal wide" id="player">
    <div class="mh">${ic('film')}<h2>${esc(a.camera)} <small style="color:var(--mut);font-weight:400">· ${fmtDT(a.inicio)}</small></h2><span class="mtag">${tag(a.tipo)}</span>
      <a class="btn" href="/clipe/${a.id}?baixar=1">${ic('download')}<span class="bt"> Baixar</span></a>
      <button class="btn red" onclick="delOne('${a.id}')">${ic('trash')}</button>
      <button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
    <div class="mb"><div style="position:relative;display:inline-block;max-width:100%"><video id="vid" src="/clipe/${a.id}" autoplay playsinline></video><canvas id="vbox" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas></div><span class="ts" id="vts"></span>
      <button class="nav l" onclick="play(${i+1})" ${i+1>=S.alerts.length?'disabled style="opacity:.3"':''} title="Alerta anterior">${ic('chevL')}</button>
      <button class="nav r" onclick="play(${i-1})" ${i<=0?'disabled style="opacity:.3"':''} title="Próximo alerta">${ic('chevR')}</button></div>
    <div class="pctl"><div class="pill" style="position:static">
      <button class="pb" onclick="play(${i+1})" title="Alerta anterior">${ic('back')}</button>
      <button class="pb" onclick="vid.currentTime-=10" title="-10s">${ic('rw')}</button>
      <button class="pb" onclick="vid.currentTime=0">${ic('skipB')}</button>
      <button class="pb" onclick="vid.paused?vid.play():vid.pause()" id="ppBtn">${ic('pause')}</button>
      <button class="pb" onclick="vid.currentTime=vid.duration-0.1">${ic('skipF')}</button>
      <button class="pb" onclick="vid.currentTime+=10" title="+10s">${ic('ff')}</button>
      <button class="pb" onclick="cycleRate(this)" style="min-width:44px">1×</button>
      <button class="pb ${localStorage.ftBoxes!=='0'?'on':''}" onclick="localStorage.ftBoxes=localStorage.ftBoxes==='0'?'1':'0';this.classList.toggle('on')" title="Mostrar detecções">${ic('user')}</button>
      <button class="pb" onclick="play(${i-1})" title="Próximo alerta" style="transform:scaleX(-1)">${ic('back')}</button>
    </div></div>
    <div class="scrub"><span id="vcur">0:00</span><input type="range" id="vbar" min="0" max="1000" value="0"><span id="vdur">0:00</span></div>
  </div>`);
  const v=$('#vid'),bar=$('#vbar'),f=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  let dets=[];api('/api/alertas/deteccoes/'+a.id).then(d=>dets=d||[]).catch(()=>{});
  const cv=$('#vbox');
  const draw=()=>{if(!document.body.contains(cv))return;requestAnimationFrame(draw);
    const W=cv.clientWidth,H=cv.clientHeight;if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
    const g=cv.getContext('2d');g.clearRect(0,0,W,H);
    if(localStorage.ftBoxes==='0'||!dets.length||!v.videoWidth)return;
    // pega a análise de antes e a de depois do tempo atual e desliza os quadrados entre elas
    const t=v.currentTime;let A=null,B=null;
    for(const d of dets){if(d.t<=t)A=d;else{B=d;break}}
    if(!A&&!B)return;
    if(!A)A=B;if(!B||B.t-A.t>6)B=null;
    if(!B&&Math.abs(t-A.t)>2.5)return;
    const k=B?Math.min(1,Math.max(0,(t-A.t)/(B.t-A.t))):0;
    const iou=(a,b)=>{const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[2],b[2]),y2=Math.min(a[3],b[3]);
      const i=Math.max(0,x2-x1)*Math.max(0,y2-y1);return i/((a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-i+1e-6)};
    const near=(a,b)=>{const ca=[(a[0]+a[2])/2,(a[1]+a[3])/2],cb=[(b[0]+b[2])/2,(b[1]+b[3])/2];return Math.hypot(ca[0]-cb[0],ca[1]-cb[1])<(a[2]-a[0])*1.2};
    const lerp=(list,key)=>A[key].map(o=>{if(!B)return o;
      let m=null,sc=0;for(const n of B[key]){if(n.n!==o.n&&key==='o')continue;const x=iou(o.b,n.b);if(x>sc||(!m&&near(o.b,n.b))){sc=x;m=n}}
      return m?{...o,b:o.b.map((v,i)=>v+(m.b[i]-v)*k)}:o});
    const best={dim:A.dim,o:lerp(A.o,'o'),f:lerp(A.f,'f')};
    const sx=W/best.dim[0],sy=H/best.dim[1];g.lineWidth=2;g.font='600 13px Segoe UI, system-ui, sans-serif';
    const box=(b,col,t)=>{const x=b[0]*sx,y=b[1]*sy,w=(b[2]-b[0])*sx,h=(b[3]-b[1])*sy;g.strokeStyle=col;g.strokeRect(x,y,w,h);
      const tw=g.measureText(t).width+8;g.fillStyle=col;g.fillRect(x-1,Math.max(0,y-19),tw,19);g.fillStyle='#000';g.fillText(t,x+3,Math.max(14,y-5))};
    best.o.forEach(o=>box(o.b,BOXCOL[o.k]||'#fff',`${o.n} ${Math.round(o.c*100)}%`));
    best.f.forEach(fc=>box(fc.b,fc.n==='desconhecido'?'#ffd000':'#2ecc71',fc.n));
  };draw();
  window.vid=v;let drag=false;
  const set=(id,k,val)=>{const e=document.getElementById(id);if(e)e[k]=val};
  v.ontimeupdate=()=>{if(!drag&&v.duration)bar.value=v.currentTime/v.duration*1000;set('vcur','textContent',f(v.currentTime));set('vts','textContent',new Date((a.inicio+v.currentTime)*1000).toLocaleString('pt-BR'))};
  v.onloadedmetadata=()=>set('vdur','textContent',f(v.duration));
  v.onplay=()=>set('ppBtn','innerHTML',ic('pause'));v.onpause=()=>set('ppBtn','innerHTML',ic('play'));
  bar.oninput=()=>{drag=true;v.currentTime=bar.value/1000*v.duration};bar.onchange=()=>drag=false;
}

/* ================= grade de detecção ================= */
async function gridEditor(id){
  if(!S.config)S.config=await api('/api/config');
  const cam=S.config.cameras.find(c=>c.id===id);if(!cam)return;
  let g=(cam.grade&&cam.grade.length===144)?cam.grade.slice():Array(144).fill(1);
  modal(`<div class="modal wide"><div class="mh">${ic('grid')}<h2>Grade de detecção · ${esc(cam.nome)}</h2><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
   <div class="mb"><div class="hint" style="margin-bottom:10px"><b style="color:#8fb4ff">Azul = detecta e grava</b> · <b style="color:#ff8a8b">Vermelho = ignora</b>. Clique e arraste pra pintar. Marque em azul o chão onde alguém pode andar (o "pé" da pessoa tem que cair no azul).</div>
    <div class="gridwrap"><img src="/api/foto/${id}?q=85&t=${Date.now()}" onerror="this.style.minHeight='300px'"><div class="gridov" id="gov"></div></div></div>
   <div class="mf"><button class="btn" onclick="gridSet(1)">Marcar tudo</button><button class="btn" onclick="gridSet(0)">Limpar</button><button class="btn" onclick="gridSet(-1)">Inverter</button>
     <span style="flex:1"></span><button class="btn pri" onclick="gridSave('${id}')">Salvar</button></div></div>`);
  const ov=$('#gov');ov.innerHTML=g.map((v,i)=>`<div data-i="${i}" class="${v?'on':''}"></div>`).join('');
  let paint=null;const apply=el=>{if(!el||el.dataset.i===undefined)return;g[+el.dataset.i]=paint;el.classList.toggle('on',!!paint)};
  let last=null;
  const cellAt=(x,y)=>{const r=ov.getBoundingClientRect();if(x<r.left||y<r.top||x>=r.right||y>=r.bottom)return null;
    return Math.floor((y-r.top)/r.height*9)*16+Math.floor((x-r.left)/r.width*16)};
  const paintAt=(x,y)=>{const i=cellAt(x,y);if(i===null)return;g[i]=paint;ov.children[i].classList.toggle('on',!!paint)};
  ov.onpointerdown=e=>{const i=cellAt(e.clientX,e.clientY);if(i===null)return;paint=g[i]?0:1;paintAt(e.clientX,e.clientY);last=[e.clientX,e.clientY];ov.setPointerCapture(e.pointerId)};
  ov.onpointermove=e=>{if(paint===null)return;const [x0,y0]=last,dx=e.clientX-x0,dy=e.clientY-y0,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/6));
    for(let k=1;k<=n;k++)paintAt(x0+dx*k/n,y0+dy*k/n);last=[e.clientX,e.clientY]};
  ov.onpointerup=()=>{paint=null;last=null};
  window._grid=g;window.gridSet=v=>{for(let i=0;i<144;i++)g[i]=v<0?(g[i]?0:1):v;ov.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('on',!!g[i]))};
}
async function gridSave(id){await api(`/api/cameras/${id}/grade`,{method:'POST',body:{grade:window._grid}});S.config=null;toast('Grade salva','info');closeModal()}

/* ================= rostos e pets ================= */
async function openFaces(tab){
  S.faceTab=tab||S.faceTab||'pessoas';
  const [d,pets]=await Promise.all([api('/api/rostos'),api('/api/pets')]);
  const tabs=[['pessoas',`Pessoas (${d.conhecidos.length})`],['vistos',`Vistos sem nome (${d.desconhecidos.length})`],['pets',`Pets (${pets.length})`]];
  let body='';
  if(S.faceTab==='pessoas'){
    body=`<div class="hint" style="margin-bottom:10px">Clique numa pessoa pra ver e adicionar fotos. Cada foto colorida ganha uma cópia em preto e branco automática, pra reconhecer também de noite.</div>
    <div class="faces">${d.conhecidos.map(k=>`<div class="face" style="cursor:pointer" onclick="openPerson('${esc(k.nome)}')">${k.foto?`<img src="/rosto/conhecido/${encodeURI(k.foto)}">`:'<div style="aspect-ratio:1;background:#000;border-radius:8px"></div>'}
      <b style="display:block;margin-top:6px">${esc(k.nome)}</b><small style="color:var(--mut)">${k.coloridas} colorida(s) · ${k.pb} p&b</small></div>`).join('')}
      <label class="face" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);min-height:150px">${ic('plus','style="width:28px;height:28px"')}Nova pessoa<input type="file" accept="image/*" style="display:none" onchange="facePhoto(this)"></label></div>`;
  }else if(S.faceTab==='vistos'){
    body=`<div class="hint" style="margin-bottom:10px">Rostos que a câmera viu. Dê um nome pra ensinar o FTCam. Clique nas fotos pra selecionar várias e nomear de uma vez.</div>
    <div class="faces">${d.desconhecidos.map(u=>`<div class="face" data-id="${u.id}"><img src="/rosto/desconhecido/${u.id}" onclick="this.parentNode.classList.toggle('sel')" style="cursor:pointer">
      <small style="color:var(--mut);display:block;margin-top:4px">${esc(u.camera)} · ${new Date(u.quando*1000).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small>
      <input placeholder="Nome" list="faceNames" onkeydown="if(event.key==='Enter')faceName('${u.id}',this.value)">
      <div class="r"><button class="btn pri" onclick="faceName('${u.id}',this.closest('.face').querySelector('input').value)">Salvar</button><button class="btn" onclick="faceDiscard('${u.id}')">${ic('trash')}</button></div></div>`).join('')||'<div class="hint">Nenhum rosto novo. Eles aparecem aqui quando a câmera vê uma pessoa de frente.</div>'}</div>
    <datalist id="faceNames">${d.conhecidos.map(k=>`<option value="${esc(k.nome)}">`).join('')}</datalist>`;
  }else{
    body=`<div class="hint" style="margin-bottom:10px">O pet é reconhecido pela <b>aparência</b> (cor e padrão do pelo). Mande 2 ou 3 fotos dele de corpo inteiro, de lados diferentes. A versão preto e branco é criada sozinha.</div>
    <div class="faces">${pets.map(pt=>`<div class="face" style="cursor:pointer" onclick="openPet('${esc(pt.nome)}')"><img src="/pet/${encodeURIComponent(pt.nome)}/${encodeURIComponent(pt.amostras[0])}" style="object-fit:cover">
      <b style="display:block;margin-top:6px">${ic('paw','style="width:13px;height:13px"')} ${esc(pt.nome)}</b><small style="color:var(--mut)">${esc(pt.tipo||'')} · ${pt.amostras.length} foto(s)</small></div>`).join('')}
      <label class="face" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);min-height:150px">${ic('plus','style="width:28px;height:28px"')}Novo pet<input type="file" accept="image/*" style="display:none" onchange="petPhoto(this)"></label></div>`;
  }
  modal(`<div class="modal wide"><div class="mh">${ic('user')}<h2>Rostos e pets</h2><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
   <div class="mb"><div class="seg" style="margin-bottom:14px">${tabs.map(([k,n])=>`<button class="${S.faceTab===k?'on':''}" onclick="openFaces('${k}')">${n}</button>`).join('')}</div>${body}</div></div>`);
}
async function openPerson(nome){
  const smp=await api('/api/rostos/pessoa/'+encodeURIComponent(nome));
  const grp=(t,list)=>`<h3 style="margin:14px 0 8px;font-size:14px;color:var(--mut)">${t} (${list.length})</h3><div class="faces">${list.map(x=>`<div class="face"><img src="/rosto/conhecido/${encodeURIComponent(nome)}/${encodeURIComponent(x.f)}">
      <div class="r"><button class="btn" onclick="sampleDel('${esc(nome)}','${x.f}')">${ic('trash')} Apagar</button></div></div>`).join('')||'<div class="hint">Nenhuma.</div>'}</div>`;
  modal(`<div class="modal wide"><div class="mh"><button class="icon-btn" onclick="openFaces('pessoas')">${ic('back')}</button>${ic('user')}<h2>${esc(nome)}</h2>
     <label class="btn" style="cursor:pointer">${ic('photo')} Adicionar foto<input type="file" accept="image/*" style="display:none" onchange="facePhoto(this,'${esc(nome)}')"></label>
     <button class="btn red" onclick="faceDel('${esc(nome)}')">${ic('trash')}</button><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
   <div class="mb"><div class="hint">Quanto mais fotos (de frente, de lado, com e sem óculos, de dia e de noite), melhor ele reconhece.</div>
    ${grp('Coloridas',smp.filter(x=>!x.pb))}${grp('Preto e branco (visão noturna)',smp.filter(x=>x.pb))}</div></div>`);
}
async function sampleDel(nome,f){await api(`/api/rostos/pessoa/${encodeURIComponent(nome)}/${encodeURIComponent(f)}`,{method:'DELETE'});openPerson(nome)}
async function faceName(id,nome){if(!nome.trim())return toast('Digite um nome','');
  const sel=[...document.querySelectorAll('.face.sel')].map(f=>f.dataset.id);const ids=sel.includes(id)?sel:[id];
  await api('/api/rostos/cadastrar',{method:'POST',body:{ids,nome}});toast(`Cadastrado: ${esc(nome)}`,'info');openFaces('vistos')}
async function faceDiscard(id){await api('/api/rostos/desconhecido/'+id,{method:'DELETE'});document.querySelector(`.face[data-id="${id}"]`)?.remove()}
async function faceDel(nome){if(!confirm(`Remover ${nome} e todas as fotos?`))return;await api('/api/rostos/pessoa/'+encodeURIComponent(nome),{method:'DELETE'});openFaces('pessoas')}
function readImg(inp){return new Promise(res=>{const f=inp.files[0];if(!f)return res(null);const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)})}
async function facePhoto(inp,nome){const img=await readImg(inp);if(!img)return;nome=nome||prompt('Nome da pessoa nesta foto:');if(!nome)return;
  const x=await api('/api/rostos/foto',{method:'POST',body:{nome,imagem:img}});toast(x.ok?'Foto adicionada (+ versão preto e branco)':esc(x.erro||'Erro'),x.ok?'info':'');x.ok?openPerson(nome):null}
async function petPhoto(inp,nome){const img=await readImg(inp);if(!img)return;nome=nome||prompt('Nome do pet:');if(!nome)return;
  const x=await api('/api/pets/foto',{method:'POST',body:{nome,imagem:img}});toast(x.ok?(x.aviso?esc(x.aviso):'Foto do pet adicionada'):esc(x.erro||'Erro'),x.ok?'info':'');if(x.ok)openPet(nome)}
async function openPet(nome){
  const pt=(await api('/api/pets')).find(p=>p.nome===nome);if(!pt)return openFaces('pets');
  modal(`<div class="modal wide"><div class="mh"><button class="icon-btn" onclick="openFaces('pets')">${ic('back')}</button>${ic('paw')}<h2>${esc(nome)} <small style="color:var(--mut);font-weight:400">${esc(pt.tipo||'')}</small></h2>
     <label class="btn" style="cursor:pointer">${ic('photo')} Adicionar foto<input type="file" accept="image/*" style="display:none" onchange="petPhoto(this,'${esc(nome)}')"></label>
     <button class="btn red" onclick="petDel('${esc(nome)}')">${ic('trash')}</button><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
   <div class="mb"><div class="faces">${pt.amostras.map(f=>`<div class="face"><img src="/pet/${encodeURIComponent(nome)}/${encodeURIComponent(f)}" style="object-fit:contain">
     <small style="color:var(--mut)">${f.includes('_pb')?'preto e branco':'colorida'}</small>
     <div class="r"><button class="btn" onclick="petSampleDel('${esc(nome)}','${f}')">${ic('trash')}</button></div></div>`).join('')}</div></div></div>`);
}
async function petSampleDel(nome,f){await api(`/api/pets/${encodeURIComponent(nome)}/${encodeURIComponent(f)}`,{method:'DELETE'});openPet(nome)}
async function petDel(nome){if(!confirm(`Remover ${nome}?`))return;await api('/api/pets/'+encodeURIComponent(nome),{method:'DELETE'});openFaces('pets')}

/* ================= controles da Tapo ================= */
async function tapoPanel(id){
  modal(`<div class="modal small"><div class="mh">${ic('siren')}<h2>Controles da Tapo</h2><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
    <div class="mb" id="tpBody"><span class="spin"></span> Conectando na câmera...</div></div>`);
  const s=await api(`/api/cameras/${id}/tapo`);
  if(!s.ok){$('#tpBody').innerHTML=`<div class="err">${esc(s.erro)}</div><div class="hint" style="margin-top:8px">Os controles usam a senha da sua conta Tapo (a do app). Preencha em Editar câmera.</div>`;return}
  const act=async(acao,valor)=>{const r=await api(`/api/cameras/${id}/tapo`,{method:'POST',body:{acao,valor}});toast(r.ok?'Feito':'Erro: '+esc(r.erro),r.ok?'info':'')};
  window._tapo=act;
  $('#tpBody').innerHTML=`<div class="hint" style="margin-bottom:12px">${esc(s.modelo)} · firmware ${esc(s.firmware)}</div>
    <div class="form">
      <label>Sirene</label><div class="tapo-ctl"><button class="btn red" onclick="_tapo('sirene',1)">${ic('siren')} Tocar</button><button class="btn" onclick="_tapo('sirene',0)">Parar</button></div>
      <label>Modo privacidade</label><label class="switch" style="justify-self:start"><input type="checkbox" ${s.privacidade?'checked':''} onchange="_tapo('privacidade',this.checked)"><span></span></label>
      <label>LED de status</label><label class="switch" style="justify-self:start"><input type="checkbox" ${s.led?'checked':''} onchange="_tapo('led',this.checked)"><span></span></label>
      <label>Visão noturna</label><div class="seg" id="tpNight">${[['auto','Auto'],['on','Sempre'],['off','Desligada']].map(([v,n])=>`<button class="${s.noturno===v?'on':''}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===this));_tapo('noturno','${v}')">${n}</button>`).join('')}</div>
    </div><div class="hint" style="margin-top:14px">Com o modo privacidade ligado, a câmera para de mandar imagem e o FTCam não grava.</div>`;
}
</script>

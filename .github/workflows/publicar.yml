name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar FTCam-Setup.exe (Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path pc/core.py -Pattern 'VERSAO = "([0-9.]+)"').Matches[0].Groups[1].Value
          $env:FTCAM_VERSAO = $v
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc setup/ftcam.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: out/FTCam-Setup.exe

  publicar:
    needs: instalador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão (vem do pc/core.py)
        id: v
        run: echo "versao=$(grep -oP 'VERSAO = "\K[0-9.]+' pc/core.py)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chave que assina o APK (Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > tv/app/release.jks; echo "assinando com a chave oficial"
          else echo "::warning::sem KEYSTORE_B64 nos Secrets: APK assinado com chave de teste"; fi

      - name: Compilar os apps (TV e celular)
        working-directory: tv
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Montar os pacotes
        run: |
          mkdir -p out
          cp tv/app/build/outputs/apk/tv/release/app-tv-release.apk out/FTCamTV.apk
          cp tv/app/build/outputs/apk/celular/release/app-celular-release.apk out/FTCam-Celular.apk

      - uses: actions/download-artifact@v4
        with:
          name: instalador
          path: out

      - uses: actions/upload-artifact@v4
        with:
          name: FTCam-${{ steps.v.outputs.versao }}
          path: out/*

      - name: Publicar versão nova (só quando o número da versão muda)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.versao }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V já publicada; pra lançar, aumente VERSAO em pc/core.py"
          else
            gh release create "v$V" out/FTCam-Setup.exe out/FTCamTV.apk out/FTCam-Celular.apk --title "FTCam $V" \
              --notes "Instalador do PC (FTCam-Setup.exe) e app da TV box/Fire TV (FTCamTV.apk, Android 5.1+) e app do celular (FTCam-Celular.apk, Android 7+). Quem já tem o FTCam instalado recebe esta versão sozinho."
          fi

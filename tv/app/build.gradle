plugins { id 'com.android.application' }

// a versão vem do programa do PC (pc/core.py), assim tudo sai com o mesmo número
def appVersion() {
    def m = (file('../../pc/core.py').text =~ /VERSAO = "([0-9.]+)"/)
    return m.find() ? m.group(1) : '1.0.0'
}
def appVersionCode() {
    def p = appVersion().tokenize('.').collect { it as int }
    return p[0] * 10000 + p[1] * 100 + p[2]
}

android {
    namespace 'br.com.facincanitech.ftcamtv'
    compileSdk 34

    defaultConfig {
        targetSdk 34
        versionCode appVersionCode()
        versionName appVersion()
    }

    buildFeatures { buildConfig true }

    // dois APKs separados, mesmo código:
    //   tv      -> FTCamTV.apk      (TV box, Fire TV, controle remoto)
    //   celular -> FTCam-Celular.apk (celular/tablet, toque)
    // pacotes diferentes: os dois podem ficar instalados no mesmo aparelho
    flavorDimensions 'tipo'
    productFlavors {
        tv {
            dimension 'tipo'
            applicationId 'br.com.facincanitech.ftcamtv'
            minSdk 22          // Android 5.1: pega Fire TV Stick antigo (Fire OS 5) e TV box velha
            resValue 'string', 'app_name', 'FTCam TV'
            buildConfigField 'boolean', 'CELULAR', 'false'
        }
        celular {
            dimension 'tipo'
            applicationId 'br.com.facincanitech.ftcam'
            minSdk 24          // Android 7.0
            resValue 'string', 'app_name', 'FTCam'
            buildConfigField 'boolean', 'CELULAR', 'true'
        }
    }

    // a chave que assina o APK fica nos Secrets do GitHub (nunca no código).
    // Sem ela (ex.: compilando em casa), assina com a chave de teste do Android.
    def ks = file('release.jks')
    signingConfigs {
        if (ks.exists()) {
            fixa {
                storeFile ks
                storePassword System.getenv('KEY_PASS')
                keyAlias 'ftcamtv'
                keyPassword System.getenv('KEY_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true          // R8: tira código e nomes sem uso, APK menor
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ks.exists() ? signingConfigs.fixa : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
